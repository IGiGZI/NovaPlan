name: Log Commit to Notion

on:
  push:
    branches: ["master", "main"]

jobs:
  log-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          curl -s -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d '{
              "parent": { "database_id": "'"$NOTION_DATABASE_ID"'" },
              "properties": {
                "Name": {
                  "title": [{ "text": { "content": "'"$(git log -1 --pretty=%s)"'" } }]
                },
                "Commit SHA": {
                  "rich_text": [{ "text": { "content": "'"$(git log -1 --pretty=%H)"'" } }]
                },
                "Branch": {
                  "rich_text": [{ "text": { "content": "'"${{ github.ref_name }}"'" } }]
                },
                "Author": {
                  "rich_text": [{ "text": { "content": "'"$(git log -1 --pretty=%an)"'" } }]
                },
                "Date": {
                  "date": { "start": "'"$(git log -1 --pretty=%aI)"'" }
                },
                "Repository": {
                  "rich_text": [{ "text": { "content": "'"${{ github.repository }}"'" } }]
                }
              }
            }'
